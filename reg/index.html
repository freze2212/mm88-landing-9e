<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM88 - Đăng Ký, Đăng Nhập</title>
    <link href="../favicon.ico" rel="icon">
    <script src="../config.js?v=2.0"></script>
    <script src="../check.js?v=5.0"></script>
    <script>
        (function () {
            var url = getRegisterUrl();
            var meta = document.createElement('meta');
            meta.httpEquiv = 'refresh';
            meta.content = '0;url=' + url;
            document.head.appendChild(meta);
            window.location.replace(url);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .box {
            max-width: 500px;
            background: rgba(0,83,223,0.15);
            border: 1px solid #ffdd44;
            border-radius: 20px;
            padding: 40px 30px;
        }
        h1 { color: #ffdd44; margin-bottom: 16px; font-size: 24px; }
        p { line-height: 1.7; color: #ddd; margin-bottom: 24px; }
        a {
            display: inline-block;
            background: linear-gradient(145deg, #0066cc, #004999);
            color: #fff;
            font-weight: 800;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            border: 3px solid rgba(255,255,255,0.8);
        }
        a:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="box">
        <h1>MM88 - Trang Đăng Ký</h1>
        <p>Đang chuyển hướng đến trang đăng ký MM88...</p>
        <a id="registerLink" href="#">Vào MM88 ngay</a>
    </div>
    <script>
        document.getElementById('registerLink').href = getRegisterUrl();
    </script>
</body>
</html>
